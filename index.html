<title> 🎬ดูหนัง - DEPLAY🍿</title>
<style>
  body {
    background-color: #121212; /* โหมดมืด */
    color: #fff;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  /* ส่วนวิดีโอหลัก */
  .video-section {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  video {
    width: 100%;
    Height: 220px;
    max-width: 400px;
    border-radius: 8px;
  }

  /* รายการปกหนังด้านล่าง */
  .thumbnails {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 10px;
  }

  .thumbnail {
    flex: 0 0 auto;
    width: 150px;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 0.2s;
  }

  .thumbnail:hover {
    transform: scale(1.05);
  }

  /* กรอบโฟกัสสีเหลือง สำหรับรีโมท Android TV / คีย์บอร์ด */
  .thumbnail:focus {
    outline: 4px solid #ffdd00;
    outline-offset: 2px;
    transform: scale(1.08);
    z-index: 2;
  }

  /* เอาไฮไลท์สีฟ้าเริ่มต้นของ Chrome/Android ออก จะได้ไม่ทับกับกรอบเหลือง */
  .thumbnail {
    -webkit-tap-highlight-color: transparent;
  }

  /* ปุ่มควบคุมด้านล่าง */
  #controls {
    display: flex;
    justify-content: center;
    margin-top: 10px;
    transition: opacity 0.4s ease;
    opacity: 1;
  }

  /* ซ่อนปุ่มควบคุมตอนเต็มจอ (ยังกดรีโมทได้ตามปกติ เพราะแค่ทำให้โปร่งใส ไม่ได้ปิดการรับ input) */
  #controls.controls-hidden {
    opacity: 0;
  }

  button {
    background-color: #333;
    color: #fff;
    border: none;
    padding: 10px 20px;
    margin: 0 5px;
    border-radius: 4px;
    cursor: pointer;
  }

  button:hover {
    background-color: #555;
  }

  /* =================================================================
     โหมดเต็มจอสำรอง (pseudo-fullscreen)
     ใช้ตอนอุปกรณ์/เบราว์เซอร์ไม่รองรับ Fullscreen API มาตรฐาน (พบบ่อยใน
     กล่อง Android TV บางรุ่น) โดยขยาย video ให้เต็มจอด้วย CSS เอง
     แทนที่จะพึ่งพา document.fullscreenElement เพียงอย่างเดียว
  ================================================================= */
  body.app-fullscreen {
    padding: 0;
    overflow: hidden;
  }

  body.app-fullscreen h1,
  body.app-fullscreen .thumbnails {
    display: none;
  }

  body.app-fullscreen .video-section {
    position: fixed;
    inset: 0;
    margin: 0;
    z-index: 1000;
    background: #000;
    align-items: center;
  }

  body.app-fullscreen video {
    width: 100vw;
    height: 100vh;
    max-width: none;
    border-radius: 0;
    object-fit: contain;
  }

  body.app-fullscreen #controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 20px;
    z-index: 1001;
    margin-top: 0;
  }
</style>

<script>
    // 1. ป้องกันการคลิกขวา (Disable Right Click)
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
    });

    // 2. ป้องกันปุ่มคีย์บอร์ดลัด (Disable Shortcuts: F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
    document.addEventListener('keydown', function(e) {
        // บล็อก F12
        if (e.key === "F12") {
            e.preventDefault();
        }
        // บล็อก Ctrl + Shift + I (เปิด DevTools)
        if (e.ctrlKey && e.shiftKey && e.key === 'I') {
            e.preventDefault();
        }
        // บล็อก Ctrl + Shift + J (เปิด Console)
        if (e.ctrlKey && e.shiftKey && e.key === 'J') {
            e.preventDefault();
        }
        // บล็อก Ctrl + U (ดู Source Code)
        if (e.ctrlKey && e.key === 'u') {
            e.preventDefault();
        }
        // บล็อก Ctrl + S (เซฟหน้าเว็บ)
        if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
        }
    });
</script>

<style>

        -webkit-user-select: none; /* Safari */
        -ms-user-select: none; /* IE 10 และ Edge */

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const video = document.getElementById('video');
const playBtn = document.getElementById('playBtn');
const muteBtn = document.getElementById('muteBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');  
const thumbnails = document.querySelectorAll('.thumbnail');

// ดึงข้อความจาก alt ของรูปภาพมาแสดงใต้ภาพอัตโนมัติ
const thumbnail = document.querySelector('.thumbnail');
const videoTitle = document.querySelector('.video-title');
if (thumbnail && videoTitle) {
  videoTitle.textContent = thumbnail.alt;
}
    
  
let currentSrc = '';
let hlsInstance = null; // เก็บ instance เดียวไว้ ป้องกันการสร้างซ้ำซ้อนจนวิดีโอหลุด/เด้งออกจากเต็มจอ

// ดัก error ที่ไม่คาดคิดไว้เฉยๆ (ไม่ throw ต่อ) เผื่อบางอุปกรณ์ไม่รองรับ API บางตัว
// จะได้ไม่ทำให้โค้ดส่วนที่เหลือด้านล่าง (เช่น การผูกปุ่มต่างๆ) หยุดทำงานไปด้วย
window.addEventListener('error', function (e) {
  console.warn('เกิดข้อผิดพลาดที่ไม่คาดคิด:', e.message);
});
window.addEventListener('unhandledrejection', function (e) {
  console.warn('เกิด Promise error ที่ไม่คาดคิด:', e.reason);
});

/* ===================================================================
   ฟังก์ชันช่วยจัดการเต็มจอแบบรองรับหลายเบราว์เซอร์/กล่องแอนดรอยด์ทีวี
   บางตัว (WebView เก่าๆ) ไม่รองรับ document.fullscreenElement / 
   element.requestFullscreen() มาตรฐาน ต้องใช้ชื่อแบบ webkit/moz/ms
   หรือ webkitEnterFullscreen (โหมดเต็มจอในตัวของ <video> เอง)
=================================================================== */
function getFullscreenElement() {
  return document.fullscreenElement ||
         document.webkitFullscreenElement ||
         document.mozFullScreenElement ||
         document.msFullscreenElement ||
         null;
}

function requestFS(el) {
  if (el.requestFullscreen) return el.requestFullscreen();
  if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
  if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
  if (el.msRequestFullscreen) return el.msRequestFullscreen();
  // หมายเหตุ: เดิมมี fallback ไปที่ el.webkitEnterFullscreen() ซึ่งเป็นโหมดเต็มจอ
  // "ในตัว" ของแท็ก <video> เอง — บนหลายกล่อง Android TV / WebView รุ่นเก่า การเรียก
  // เมธอดนี้จะโยนการเล่นวิดีโอออกไปให้ตัวเล่นวิดีโอระดับ OS (นอก WebView) ควบคุมแทน
  // ถ้าตัวเล่นนั้นเจอปัญหา (บัฟเฟอร์/โคเดก) มันมักจะปิดตัวเองและพา WebView/แอปที่ครอบอยู่
  // เด้งกลับไปหน้าโฮมของกล่องไปด้วย ซึ่งตรงกับอาการที่เจอ จึงตัดออก แล้วปล่อยให้ตกไปใช้
  // โหมดเต็มจอจำลองด้วย CSS (class "app-fullscreen") ที่ปลอดภัยกว่าแทน
  return Promise.reject(new Error('อุปกรณ์นี้ไม่รองรับ Fullscreen API มาตรฐาน จะใช้โหมดเต็มจอจำลองแทน'));
}

function exitFS() {
  if (document.exitFullscreen) return document.exitFullscreen();
  if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
  if (document.webkitCancelFullScreen) return document.webkitCancelFullScreen();
  if (document.mozCancelFullScreen) return document.mozCancelFullScreen();
  if (document.msExitFullscreen) return document.msExitFullscreen();
}

// ตั้งค่า hls.js แบบประหยัดหน่วยความจำ สำหรับกล่องแอนดรอยด์ทีวี/กล่องทัวร์สเปกต่ำ
// (ค่า default ของ hls.js อาจปล่อยให้บัฟเฟอร์บวมจนแรมกล่องไม่พอ แล้ว OS สั่งฆ่า
// โปรเซส WebView ทิ้ง ทำให้แอปที่ครอบเว็บนี้อยู่เด้งกลับไปหน้าโฮมของกล่องหลังเล่นได้สักพัก)
const hlsConfig = {
  maxBufferLength: 15,               // บัฟเฟอร์ล่วงหน้าปกติ ~15 วิ (ค่า default คือ 30)
  maxMaxBufferLength: 30,            // เพดานบัฟเฟอร์สูงสุดตอนเน็ตดี ~30 วิ (ค่า default คือ 600!)
  maxBufferSize: 30 * 1000 * 1000,   // จำกัดบัฟเฟอร์ ~30MB (ค่า default คือ 60MB)
  backBufferLength: 10,              // ล้างส่วนที่เล่นผ่านไปแล้วออกจากหน่วยความจำ ไม่ให้ค้างสะสม
  enableWorker: true                 // ประมวลผลนอก main thread กันหน้าเว็บค้างขณะเล่น
};

// สร้าง instance ของ hls.js พร้อมผูก error handler ไว้ในตัวเดียว เรียกซ้ำได้ปลอดภัย
// (ของเดิมตอน error ประเภทอื่นๆ ที่ไม่ใช่ NETWORK/MEDIA จะสร้าง instance ใหม่แต่ลืมผูก
// error handler ซ้ำ ทำให้หลังจากนั้นถ้า error อีกครั้งจะไม่มีใครดักจับ/กู้คืนให้)
function createHlsInstance(src) {
  const instance = new Hls(hlsConfig);
  instance.loadSource(src);
  instance.attachMedia(video);

  // ดักจับ error แล้วพยายามกู้คืนแทนที่จะปล่อยให้วิดีโอหยุด/รีเซ็ต
  // (การที่วิดีโอหยุดกะทันหันจาก error บางทีทำให้ระบบเบราว์เซอร์ยกเลิกเต็มจอไปด้วย)
  instance.on(Hls.Events.ERROR, function (event, data) {
    if (!data.fatal) return;
    switch (data.type) {
      case Hls.ErrorTypes.NETWORK_ERROR:
        instance.startLoad();
        break;
      case Hls.ErrorTypes.MEDIA_ERROR:
        instance.recoverMediaError();
        break;
      default:
        instance.destroy();
        if (hlsInstance === instance) {
          hlsInstance = createHlsInstance(src);
        }
        break;
    }
  });

  return instance;
}

function playThumbnail(thumb) {
  const src = thumb.getAttribute('data-src');
  currentSrc = src;

  // ทำลาย instance เดิมก่อนเสมอ ไม่ให้มีหลาย instance แย่งกันควบคุม video
  // (สาเหตุหลักที่เล่นไปสักพักแล้วเด้งออกจากเต็มจอ/ค้าง)
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  if (Hls.isSupported()) {
    hlsInstance = createHlsInstance(src);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
  }

  video.play().catch(() => {});

  // ถ้ากำลังอยู่ในโหมดเต็มจอ (pseudo-fullscreen ของเรา) อยู่แล้ว
  // class "app-fullscreen" ยังติดอยู่ที่ body เหมือนเดิมอัตโนมัติ
  // แค่ลองขอเต็มจอแบบเบราว์เซอร์จริงซ้ำเผื่อหลุดตอนเปลี่ยนวิดีโอ
  if (appFullscreen && !getFullscreenElement()) {
    requestFS(video).catch(() => {});
  }
}

thumbnails.forEach(thumb => {
  // ทำให้การ์ดหนังรับโฟกัสได้ (จำเป็นสำหรับรีโมท Android TV)
  if (!thumb.hasAttribute('tabindex')) {
    thumb.setAttribute('tabindex', '0');
  }
  // ทำให้ตัวอ่านหน้าจอ/ผู้ใช้เข้าใจว่าเป็นปุ่มกดได้
  thumb.setAttribute('role', 'button');

  thumb.addEventListener('click', () => {
    playThumbnail(thumb);
  });

  // รองรับปุ่ม OK/Enter ของรีโมท และปุ่ม Space บนคีย์บอร์ด
  thumb.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      playThumbnail(thumb);
    }
  });

  // เลื่อนแถบ thumbnails ให้เห็นการ์ดที่กำลังโฟกัสอยู่เสมอ
  thumb.addEventListener('focus', () => {
    thumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
});

/* ===================================================================
   ระบบนำทางด้วยรีโมท/ลูกศร (Custom Spatial Navigation)
   เบราว์เซอร์ทั่วไปไม่มีระบบเลื่อนโฟกัสด้วยลูกศรข้ามคอนเทนเนอร์ให้อัตโนมัติ
   จึงต้องจัดการเองเพื่อให้กด "ลง" จากแถวเมนู ไปแถวการ์ดหนังได้
=================================================================== */
const focusRows = [
  Array.from(document.querySelectorAll('#controls button')), // แถวเมนู
  // แต่ละ .thumbnails div คือการ์ดหนัง "หนึ่งแถว" แยกกัน เพื่อให้กดลง/ขึ้นข้ามแถวได้
  ...Array.from(document.querySelectorAll('.thumbnails')).map(row =>
    Array.from(row.querySelectorAll('.thumbnail'))
  )
];

function findFocusPosition(el) {
  for (let r = 0; r < focusRows.length; r++) {
    const c = focusRows[r].indexOf(el);
    if (c !== -1) return { r, c };
  }
  return null;
}

function moveFocus(r, c) {
  const row = focusRows[r];
  if (!row || !row.length) return;
  c = Math.max(0, Math.min(c, row.length - 1));
  row[c].focus();
}

document.addEventListener('keydown', (e) => {
  const pos = findFocusPosition(document.activeElement);
  if (!pos) return; // ถ้าโฟกัสอยู่นอกกลุ่มที่เราคุม (เช่น อยู่ในตัวเล่นวิดีโอ) ปล่อยให้ browser จัดการปกติ

  switch (e.key) {
    case 'ArrowRight':
      e.preventDefault();
      moveFocus(pos.r, pos.c + 1);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      moveFocus(pos.r, pos.c - 1);
      break;
    case 'ArrowDown':
      e.preventDefault();
      moveFocus(Math.min(pos.r + 1, focusRows.length - 1), pos.c);
      break;
    case 'ArrowUp':
      e.preventDefault();
      moveFocus(Math.max(pos.r - 1, 0), pos.c);
      break;
  }
});

// ตั้งโฟกัสเริ่มต้นที่ปุ่มแรก เพื่อให้กดลูกศรใช้งานได้ทันทีตั้งแต่เปิดหน้า
if (focusRows[0] && focusRows[0][0]) {
  focusRows[0][0].focus();
}

// ปุ่มเล่น/หยุด
document.getElementById('playBtn').addEventListener('click', () => {
  if (video.paused) {
    video.play();
  } else {
    video.pause();
  }
});

// ปุ่มเปิด/ปิดเสียง
document.getElementById('muteBtn').addEventListener('click', () => {
  video.muted = !video.muted;
});


// ปุ่มเปิด/เต็มจอ
// หมายเหตุ: บางกล่อง Android TV ไม่รองรับ Fullscreen API มาตรฐานเลย
// (requestFullscreen ไม่มีผล/ไม่ throw error แต่ก็ไม่เต็มจอ) จึงใช้
// class "app-fullscreen" บน body เป็นตัวคุมเต็มจอหลัก (CSS fallback)
// ควบคู่ไปกับการลองเรียก Fullscreen API จริงด้วยเผื่ออุปกรณ์รองรับ
let appFullscreen = false;

function enterAppFullscreen() {
  appFullscreen = true;
  document.body.classList.add('app-fullscreen');
  requestFS(video).catch(() => {}); // ลองเต็มจอแบบเบราว์เซอร์จริงด้วย ถ้าไม่รองรับก็ไม่เป็นไร
  showControls();
}

function exitAppFullscreen() {
  appFullscreen = false;
  document.body.classList.remove('app-fullscreen');
  if (getFullscreenElement()) {
    exitFS();
  }
  clearTimeout(hideControlsTimer);
  controlsEl.classList.remove('controls-hidden');
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!appFullscreen) {
    enterAppFullscreen();
  } else {
    exitAppFullscreen();
  }
});

/* ===================================================================
   ซ่อน/แสดงปุ่มควบคุมอัตโนมัติตอนเต็มจอ (3 วินาทีไม่มีการกดจะซ่อน)
   หมายเหตุ: ใช้ opacity ไม่ใช่ display:none จึงยังกดรีโมท/คีย์บอร์ด
   เลือกโฟกัสปุ่มต่างๆ (รวมถึงปุ่มเต็มจอ) ได้ตามปกติแม้ตอนซ่อนอยู่
   ผูกกับตัวแปร appFullscreen (ไม่ใช่ document.fullscreenElement อย่างเดียว)
   เพื่อให้ทำงานได้แม้อุปกรณ์ไม่รองรับ Fullscreen API มาตรฐาน
=================================================================== */
const controlsEl = document.getElementById('controls');
let hideControlsTimer = null;

function showControls() {
  controlsEl.classList.remove('controls-hidden');
  clearTimeout(hideControlsTimer);
  if (appFullscreen) {
    hideControlsTimer = setTimeout(() => {
      controlsEl.classList.add('controls-hidden');
    }, 3000);
  }
}

// ทุกครั้งที่มีการกดปุ่ม/รีโมท (ลูกศร, Enter ฯลฯ) หรือขยับเมาส์/แตะจอ ให้โชว์ปุ่มอีกครั้ง
document.addEventListener('keydown', showControls);
document.addEventListener('mousemove', showControls);
document.addEventListener('touchstart', showControls);

// ถ้าออกจากเต็มจอโดยวิธีอื่น (เช่น กดปุ่ม back ของรีโมท/ทีวี ที่ยกเลิก
// เต็มจอแบบเบราว์เซอร์จริง) ให้ซิงค์สถานะ appFullscreen กลับมาด้วย
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange']
  .forEach(evt => document.addEventListener(evt, () => {
    if (!getFullscreenElement() && appFullscreen) {
      // เบราว์เซอร์ยกเลิกเต็มจอเอง แต่เรายังอยู่ในโหมด pseudo-fullscreen ของเราต่อได้
      // (ไม่บังคับออกจาก app-fullscreen เพราะ CSS fallback ยังทำงานได้โดยไม่พึ่ง API นี้)
    }
  }));

// ปุ่มย้อนกลับไป 10 วินาที (Rewind)
document.getElementById('rewindBtn').addEventListener('click', () => {
  video.currentTime = Math.max(0, video.currentTime - 10);
});

// ปุ่มข้ามไปข้างหน้า 10 วินาที (Fast Forward)
document.getElementById('forwardBtn').addEventListener('click', () => {
  video.currentTime = Math.min(video.duration, video.currentTime + 10);
});

  
</script>
